name: Update profile metrics

on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate localized profile metrics
        run: node scripts/update-profile-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-metrics.en.svg assets/profile-metrics.pt-BR.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile metrics"
            git push
          fi
